name: Refresh Cerno Dilemma data

# Pulls today's dilemma + freezes yesterday's final vote %, commits the JSON,
# and the commit triggers the existing "Deploy Cerno to GitHub Pages" workflow.
#
# "Today" is computed in Europe/London inside the script, NOT from the runner's
# UTC clock. A fixed UTC time drifts against London midnight across the BST/GMT
# switch, so we fire at both 23:05 and 00:05 UTC; the script is idempotent and
# write-once, so the second run each day is a harmless no-op.

on:
  schedule:
    - cron: "5 23 * * *" # 00:05 London while BST (summer)
    - cron: "5 0 * * *" # 00:05 London while GMT (winter)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to dispatch the Pages deploy after committing

concurrency:
  group: refresh-dilemmas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh dilemma data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-dilemmas.mjs

      - name: Commit changes and deploy (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(git status --porcelain app/dilemma/data)" ]]; then
            git config user.name "cerno-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/dilemma/data
            git commit -m "chore: refresh Cerno Dilemma data ($(date -u +%F))"
            git push
            # A commit pushed with GITHUB_TOKEN does NOT trigger the on:push
            # deploy (GitHub blocks recursive runs), so dispatch it explicitly.
            gh workflow run deploy-pages.yml
          else
            echo "No dilemma changes — nothing to deploy."
          fi
